[project]
name = "mutsumi-bot"
version = "0.1.0"
description = "Very cute Mutsumi bot."
authors = [
    { name = "OasisAkari", email = "oasisakari@gmail.com" },
    { name = "Dianliang233", email = "dianliang@teahou.se" },
    { name = "DoroWolf", email = "dorowolf314@gmail.com" },
    { name = "nullcat", email = "null@teahou.se" },
    { name = "_LittleC_", email = "i@ltlec.com" },
    { name = "cloudw233", email = "cloudw233@outlook.com" },
]
requires-python = "3.12"
readme = "README.md"
license = "AGPL-3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "akari-bot-webrender==0.5.13",
    "akari-bot-webui==0.3.7",
    "coverage>=7.9.1,<8",
    "cryptography>=46.0.0,<47",
    "deprecated>=1.2.18,<2",
    "poetry-plugin-export>=1.9.0,<2",
    "pre-commit>=4.0.0,<5",
    "pycryptodome>=3.18.0,<4",
    "python-dotenv>=1.2.1,<2",
    "python-multipart>=0.0.22,<0.0.23",
    "pywin32>=308,<309 ; sys_platform == 'win32'",
    "aiocqhttp>=1.4.3,<2",
    "argon2-cffi>=25.0.0,<26",
    "fastapi>=0.120.0, <1.0.0",
    "ffmpy>=1.0.0,<2",
    "khl-py>=0.3.16,<0.4",
    "pyjwt[crypto]>=2.8.0,<3",
    "qq-botpy>=1.2.1,<2",
    "slowapi>=0.1.9,<0.2",
    "uvicorn[standard]>=0.38.0, <1.0.0",
    "cattrs>=25.0.0,<26",
    "filetype>=1.2.0,<2",
    "japanera>=2.1.3,<3",
    "orjson>=3.10.9,<4",
    "Pillow>=12.0.0,<13",
    "tenacity>=9.0.0,<10",
    "tomlkit>=0.13.2,<0.14",
    "tortoise-orm[]>=0.25.0,<0.26",
    "aiofile>=3.8.1,<4",
    "attrs>=25.0.0,<26",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1.6,<4",
    "loguru>=0.7.0,<0.8",
    "ff3>=1.0.2,<2",
    "psutil>=7.0.0,<8",
    "tabulate>=0.9.0,<0.10",
    "APScheduler>=3.9.1.post0,<4",
    "matplotlib>=3.6.3,<4",
    "py-cpuinfo>=9.0.0,<10",
    "beautifulsoup4>=4.11.1,<5",
    "emoji>=2.12.1,<3",
    "feedparser>=6.0.10,<7",
    "google-play-scraper>=1.2.2,<2",
    "gql>=4.0.0,<5",
    "langconv",
    "mcstatus>=12.0.0,<13",
    "numpy<2.4.3",
    "openai>=2.0.0,<3",
    "pandas>=3.0.0,<4",
    "pint>=0.25.0,<0.26",
    "python-whois>=0.9.0,<0.10",
    "rdkit>=2025.0.0,<2026",
    "simpleeval>=1.0.0,<2",
    "webcolors>=25.0.0,<26",
    "wolframalpha>=5.0.0,<6",
]

[dependency-groups]
dev = [
    "autopep8>=2.0.2,<3",
    "pycodestyle==2.14.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.uv.sources]
langconv = { git = "https://github.com/Teahouse-Studios/langconv.py.git" }

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3

[tool.pyright]
reportUndefinedVariable = "error"
venvPath = "."
venv = ".venv"
